[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "industrial-iot-predictive-platform"
version = "0.1.0"
description = "Portfolio-scale industrial IoT monitoring and anomaly analytics platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Harsha Sanka"}]
dependencies = [
  "aiomqtt>=2.3,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<2.5",
  "asyncua>=1.1,<2",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pydantic-settings>=2.6,<3",
  "scikit-learn>=1.5,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "streamlit>=1.39,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.6,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iiot_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/iiot_platform/api/routes/*.py" = ["B008"]
